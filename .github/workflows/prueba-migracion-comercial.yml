name: Prueba de migración comercial

on:
  pull_request:
    paths:
      - "supabase/migracion-comercial-para-revision.sql"
      - "supabase/tests/**"
      - "panel-comercio.html"
      - ".github/workflows/prueba-migracion-comercial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-17:
    name: PostgreSQL 17 aislado
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: encontrarlo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d encontrarlo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: encontrarlo_test
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear esquema ficticio de Supabase
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/fixtures/esquema-supabase-prueba.sql

      - name: Ejecutar migración en la base descartable
        run: psql -v ON_ERROR_STOP=1 -f supabase/migracion-comercial-para-revision.sql

      - name: Verificar permisos y flujos del panel
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/verificar-migracion-comercial.sql

      - name: Validar sintaxis JavaScript del panel
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("panel-comercio.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No se encontró el JavaScript del panel")
          Path("/tmp/panel-comercio.js").write_text(scripts[-1])
          PY
          node --check /tmp/panel-comercio.js
